<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>fcopy</title>
  <link rel="stylesheet" href="/static/app.css">
  <script defer src="/static/alpine.min.js"></script>
  <script src="/static/app.js"></script>
</head>
<body class="min-h-dvh bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100" x-data="fcopy()" x-init="start()">

<!-- ---------- Login ---------- -->
<main x-show="!user" x-cloak class="mx-auto flex min-h-dvh max-w-sm flex-col justify-center px-4">
  <h1 class="mb-6 text-2xl font-semibold">fcopy</h1>
  <form class="space-y-4" @submit.prevent="login()">
    <label class="block">
      <span class="text-sm">Username</span>
      <input name="user" x-model="form.user" autocomplete="username" required
             class="mt-1 min-h-11 w-full rounded-lg border border-zinc-300 bg-white px-3 dark:border-zinc-700 dark:bg-zinc-900">
    </label>
    <label class="block">
      <span class="text-sm">Password</span>
      <input name="password" type="password" x-model="form.password" autocomplete="current-password" required
             class="mt-1 min-h-11 w-full rounded-lg border border-zinc-300 bg-white px-3 dark:border-zinc-700 dark:bg-zinc-900">
    </label>
    <p x-show="error" x-text="error" role="alert" class="text-sm text-red-600"></p>
    <button type="submit" :disabled="busy"
            class="min-h-11 w-full rounded-lg bg-emerald-600 font-medium text-white hover:bg-emerald-700 disabled:opacity-60">
      Sign in
    </button>
  </form>
</main>

<!-- ---------- Dashboard ---------- -->
<div x-show="user" x-cloak class="mx-auto max-w-5xl px-4 pb-24 pt-4">
  <header class="flex items-center justify-between gap-2">
    <h1 class="text-xl font-semibold">fcopy</h1>
    <div class="flex items-center gap-3 text-sm">
      <span class="hidden sm:inline" x-text="user?.name"></span>
      <span class="rounded-full px-2 py-0.5 text-xs"
            :class="live ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900 dark:text-emerald-200' : 'bg-zinc-200 text-zinc-700 dark:bg-zinc-800 dark:text-zinc-300'"
            x-text="live ? 'live' : 'reconnecting…'"></span>
      <button class="min-h-11 rounded-lg border border-zinc-300 px-3 dark:border-zinc-700" @click="logout()">Sign out</button>
    </div>
  </header>

  <!-- New transfer -->
  <section class="mt-6 rounded-xl border border-zinc-200 bg-white p-4 dark:border-zinc-800 dark:bg-zinc-900">
    <h2 class="mb-3 font-medium">New transfer</h2>
    <form class="grid gap-3 md:grid-cols-2" @submit.prevent="create()">
      <label class="md:col-span-2">
        <span class="text-sm">Sources (one absolute path per line)</span>
        <textarea rows="2" x-model="newJob.sources" required
                  class="mt-1 w-full rounded-lg border border-zinc-300 bg-white p-2 font-mono text-sm dark:border-zinc-700 dark:bg-zinc-950"></textarea>
      </label>
      <label>
        <span class="text-sm">Destination folder</span>
        <input x-model="newJob.dest" required class="mt-1 min-h-11 w-full rounded-lg border border-zinc-300 bg-white px-3 font-mono text-sm dark:border-zinc-700 dark:bg-zinc-950">
      </label>
      <label>
        <span class="text-sm">Label (optional)</span>
        <input x-model="newJob.label" class="mt-1 min-h-11 w-full rounded-lg border border-zinc-300 bg-white px-3 dark:border-zinc-700 dark:bg-zinc-950">
      </label>
      <p x-show="notice" x-text="notice" role="status" class="text-sm md:col-span-2"></p>
      <div class="md:col-span-2">
        <button type="submit" class="min-h-11 rounded-lg bg-emerald-600 px-5 font-medium text-white hover:bg-emerald-700">Start copy</button>
      </div>
    </form>
  </section>

  <!-- Active transfers -->
  <section class="mt-6">
    <h2 class="mb-3 font-medium">Transfers</h2>
    <p x-show="jobList().length === 0" class="text-sm text-zinc-500">No transfers yet.</p>
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
      <template x-for="job in jobList()" :key="job.id">
        <article class="min-w-0 rounded-xl border border-zinc-200 bg-white p-4 dark:border-zinc-800 dark:bg-zinc-900">
          <header class="flex items-start justify-between gap-2">
            <h3 class="truncate font-medium" x-text="job.label"></h3>
            <span class="shrink-0 rounded-full bg-zinc-100 px-2 py-0.5 text-xs dark:bg-zinc-800" x-text="stateLabel(job.state)"></span>
          </header>
          <p class="mt-1 truncate font-mono text-xs text-zinc-500" x-text="job.current_file || ' '"></p>

          <div class="mt-3 h-2 overflow-hidden rounded bg-zinc-200 dark:bg-zinc-800"
               role="progressbar" :aria-valuenow="Math.round(job.percent)" aria-valuemin="0" aria-valuemax="100"
               :aria-label="job.label">
            <div class="h-2 bg-emerald-500 transition-[width] duration-200" :style="`width:${job.percent}%`"></div>
          </div>

          <div class="mt-2 flex flex-wrap justify-between gap-x-4 text-sm">
            <span x-text="`${Math.round(job.percent)}%`"></span>
            <span x-text="fmtRate(job.rate_bps)"></span>
            <span x-text="`ETA ${fmtEta(job.eta_secs)}`"></span>
            <span class="text-zinc-500" x-text="`${job.files_done}/${job.files_total} files`"></span>
          </div>

          <canvas class="mt-2 h-10 w-full" width="300" height="40" :data-job="job.id" aria-hidden="true"></canvas>

          <div class="mt-3 flex gap-2">
            <button x-show="job.state === 'running'" class="min-h-11 flex-1 rounded-lg border border-zinc-300 dark:border-zinc-700"
                    @click="act(job, 'pause')">Pause</button>
            <button x-show="job.state === 'paused'" class="min-h-11 flex-1 rounded-lg border border-zinc-300 dark:border-zinc-700"
                    @click="act(job, 'resume')">Resume</button>
            <button x-show="job.state === 'pending' || job.state === 'running' || job.state === 'paused'"
                    class="min-h-11 flex-1 rounded-lg border border-red-300 text-red-700 dark:border-red-900 dark:text-red-300"
                    @click="cancel(job)">Cancel</button>
            <button x-show="!['pending','running','paused'].includes(job.state)"
                    class="min-h-11 flex-1 rounded-lg border border-zinc-300 dark:border-zinc-700"
                    @click="cancel(job)">Remove</button>
          </div>
        </article>
      </template>
    </div>
  </section>

  <!-- Errors and skipped files -->
  <details class="mt-6 rounded-xl border border-zinc-200 bg-white p-4 dark:border-zinc-800 dark:bg-zinc-900">
    <summary class="min-h-11 cursor-pointer font-medium">Errors and skipped files (<span x-text="logs.length"></span>)</summary>
    <ul class="mt-3 max-h-64 space-y-1 overflow-auto font-mono text-xs">
      <template x-for="(line, i) in logs" :key="i">
        <li :class="line.kind === 'skipped' ? 'text-amber-700 dark:text-amber-300' : 'text-red-700 dark:text-red-300'"
            x-text="`[${line.kind}] job ${line.job}: ${line.message}`"></li>
      </template>
    </ul>
  </details>
</div>
</body>
</html>
