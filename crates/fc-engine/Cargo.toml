[package]
name = "fc-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Core file copy + verify engine (buffered pipeline, checksums, space pre-check, error recovery)"
license = "MIT OR Apache-2.0"

[dependencies]
fs4 = { version = "1.1.0", features = ["sync"] }
md-5 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
xattr = "1.6.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
tempfile = "3.27.0"
