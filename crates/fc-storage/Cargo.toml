[package]
name = "fc-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Hardware-free core of the storage toolkit: device model, safety rules, plan validation, wipe engine, health parsing, platform traits, read-only Linux adapter, and (behind a feature) the guarded write pipeline and worker protocol"
license = "MIT OR Apache-2.0"

[features]
default = []
# Compiles the destructive path: the guarded pipeline, the worker protocol and
# the Linux block-device writer. Off by default, so a normal build cannot write
# to a disk. Enable it only for the privileged worker and for the test suite.
storage-destructive = []

[dependencies]
getrandom = "0.3"
hmac = "0.13"
rand_chacha = "0.9"
rand_core = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2.0.21"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "fcopy-storage-worker"
path = "src/bin/fcopy-storage-worker.rs"
required-features = ["storage-destructive"]
