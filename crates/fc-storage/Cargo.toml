[package]
name = "fc-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Hardware-free core of the storage toolkit: device model, safety rules, plan validation, wipe engine, health parsing, platform traits, read-only Linux adapter, worker protocol"
license = "MIT OR Apache-2.0"

[dependencies]
getrandom = "0.3"
hmac = "0.13"
rand_chacha = "0.9"
rand_core = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
