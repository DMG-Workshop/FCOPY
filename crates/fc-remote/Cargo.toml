[package]
name = "fc-remote"
description = "Secure remote transfer engine for fcopy: QUIC + TLS 1.3, SCRAM-argon2 auth, resumable streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
fc-engine = { path = "../fc-engine" }
fs4 = { version = "1.1.0", features = ["sync"] }
hmac = "0.13.0"
ipnet = "2.12.2"
mdns-sd = "0.21.6"
postcard = { version = "1.1.3", features = ["alloc"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = "0.14.7"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "fs", "io-util", "macros", "sync", "time", "signal"] }
toml = "1.1.8"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "time"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
