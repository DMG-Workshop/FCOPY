[package]
name = "fc-torrent"
description = "BitTorrent engine for fcopy: magnet links and .torrent files, seeding and downloading"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
librqbit = "9.0.1"
thiserror = "2.0.21"
anyhow = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"
