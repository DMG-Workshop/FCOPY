name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  storage-destructive:
    # The destructive feature of fc-storage, linted and tested on a Linux kernel.
    # The loop-device tests need root and the storage tools, and they run only when
    # FCOPY_LOOP_TESTS is set. They use loop devices backed by files, never a real disk.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install storage tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gdisk exfatprogs dosfstools ntfs-3g e2fsprogs smartmontools util-linux
    - name: Lint the destructive feature
      run: cargo clippy -p fc-storage --all-targets --features storage-destructive -- -D warnings
    - name: Unit tests with the destructive feature
      run: cargo test -p fc-storage --features storage-destructive --lib
    - name: Loop-device tests (root)
      # The test binaries are built as the normal user, so the toolchain is found as usual.
      # Only the compiled binaries run under sudo, which needs no Rust toolchain.
      run: |
        for t in loop_device worker_loop worker_binary; do
          exe=$(cargo test -p fc-storage --features storage-destructive --test "$t" --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable' | tail -1)
          echo "running $t: $exe"
          sudo env "PATH=$PATH" FCOPY_LOOP_TESTS=1 "$exe" --test-threads=1
        done
