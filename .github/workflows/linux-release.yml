name: FCOPY releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build DEB, RPM and AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build and package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libssl-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libgl1-mesa-dev libegl1-mesa-dev \
            dpkg-dev rpm patchelf desktop-file-utils appstream shellcheck \
            curl file xz-utils xvfb xauth libgl1-mesa-dri
      - name: Select current stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
      - name: Check release version and packaging syntax
        id: version
        run: |
          echo "value=$(bash packaging/linux/check-version.sh)" >> "$GITHUB_OUTPUT"
          shellcheck packaging/linux/*.sh packaging/hosted/*.sh packaging/docker/*.sh packaging/macos/*.sh packaging/arch/PKGBUILD
          desktop-file-validate packaging/linux/io.github.fcopy.desktop
          appstreamcli validate --no-net packaging/linux/io.github.fcopy.metainfo.xml
      - name: Test workspace
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: cargo test --locked --workspace
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build release applications
        run: cargo build --locked --release -p fc-cli -p fc-gui -p fc-web
      - name: Build packages
        run: |
          bash packaging/linux/build.sh all
          bash packaging/hosted/build.sh
      - name: Smoke-test AppImage on baseline Linux
        run: bash packaging/linux/smoke-test.sh dist/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  deb-test:
    name: Install DEB on Ubuntu ${{ matrix.ubuntu }}
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git xvfb xauth libgl1-mesa-dri desktop-file-utils
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - name: Install and test package and AppImage
        shell: bash
        run: |
          apt-get install -y ./dist/*.deb
          bash packaging/linux/smoke-test.sh
          chmod +x dist/*.AppImage
          bash packaging/linux/smoke-test.sh dist/*.AppImage
          apt-get remove -y fcopy
          test ! -e /usr/bin/fcopy
          test ! -e /usr/bin/fcopy-gui

  rpm-test:
    name: Install RPM on Fedora 44
    needs: build
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 20
    steps:
      - name: Install test dependencies
        run: |
          dnf install -y git ca-certificates xorg-x11-server-Xvfb xorg-x11-xauth \
            mesa-dri-drivers mesa-libGL desktop-file-utils diffutils
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - name: Install and test package and AppImage
        shell: bash
        run: |
          dnf install -y ./dist/*.rpm
          # Fedora does not ship Debian's xvfb-run wrapper.
          Xvfb :99 -screen 0 1280x720x24 -ac &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid"; wait "$xvfb_pid" || true' EXIT
          export DISPLAY=:99
          for ((attempt=0; attempt<100; attempt++)); do
            test ! -S /tmp/.X11-unix/X99 || break
            kill -0 "$xvfb_pid"
            sleep 0.1
          done
          test -S /tmp/.X11-unix/X99
          bash packaging/linux/smoke-test.sh --existing-display
          chmod +x dist/*.AppImage
          bash packaging/linux/smoke-test.sh --existing-display dist/*.AppImage
          dnf remove -y fcopy
          test ! -e /usr/bin/fcopy
          test ! -e /usr/bin/fcopy-gui

  arch:
    name: Build and install Arch package
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 90
    steps:
      - name: Install build and runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            rust git cmake pkgconf openssl ca-certificates libxkbcommon \
            libxkbcommon-x11 libglvnd libx11 libxcursor libxi libxrandr \
            wayland hicolor-icon-theme mesa xorg-server-xvfb xorg-xauth \
            desktop-file-utils appstream
          useradd --create-home builder
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build actual PKGBUILD against this checkout
        shell: bash
        run: |
          version=$(bash packaging/linux/check-version.sh)
          # Branch/PR builds may not have a release tag yet. A private mirror
          # maps the unchanged recipe's tagged URL to this exact tested commit.
          git clone --bare . /tmp/fcopy-source.git
          git --git-dir=/tmp/fcopy-source.git tag --force "v$version" "$GITHUB_SHA"
          chown -R builder /tmp/fcopy-source.git "$GITHUB_WORKSPACE"
          # makepkg deliberately ignores global Git configuration.
          git config --file /tmp/fcopy-makepkg.gitconfig \
            url.file:///tmp/fcopy-source.git.insteadOf https://github.com/DMG-Workshop/FCOPY.git
          git config --file /tmp/fcopy-makepkg.gitconfig protocol.file.allow always
          runuser -u builder -- env MAKEPKG_GIT_CONFIG=/tmp/fcopy-makepkg.gitconfig \
            bash -c 'cd packaging/arch && makepkg --cleanbuild --force --noconfirm'
          mkdir -p dist
          cp packaging/arch/fcopy-*.pkg.tar.zst dist/
      - name: Install and smoke-test Arch package
        shell: bash
        run: |
          pacman -U --noconfirm dist/*.pkg.tar.zst
          bash packaging/linux/smoke-test.sh
          pacman -R --noconfirm fcopy
          test ! -e /usr/bin/fcopy
          test ! -e /usr/bin/fcopy-gui
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: |
            dist/*.pkg.tar.zst
            !dist/*-debug-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install icon renderer and Rust
        run: |
          brew install librsvg
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Test native macOS branches
        run: |
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build and test DMG
        run: |
          cargo build --locked --release -p fc-cli -p fc-gui
          bash packaging/macos/build.sh
          bash packaging/macos/smoke-test.sh dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x86-64 unsigned packages
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select native MSVC Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable-x86_64-pc-windows-msvc
          rustup component add clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build self-contained unsigned desktop and CLI
        run: cargo build --locked --release -p fc-cli -p fc-gui
      - name: Locate installer compiler
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
            Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
            if ((Get-FileHash -LiteralPath $setup).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') {
              throw 'Inno Setup download checksum mismatch'
            }
            $tools = Join-Path $env:RUNNER_TEMP 'inno'
            $process = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /NOICONS /DIR=`"$tools`"" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Compiler installation failed: $($process.ExitCode)" }
            $compiler = Join-Path $tools 'ISCC.exe'
          }
          "FCOPY_ISCC=$compiler" >> $env:GITHUB_ENV
      - name: Build and test Windows packages
        run: |
          .\packaging\windows\build.ps1 -Compiler $env:FCOPY_ISCC
          .\packaging\windows\test-packages.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*-windows-x86_64-unsigned-setup.exe
            dist/*-windows-x86_64-unsigned-portable.zip
          if-no-files-found: error
          retention-days: 14

  docker-test:
    name: Test hosted Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and test production container
        run: |
          version=$(bash packaging/linux/check-version.sh)
          docker build --file packaging/docker/Dockerfile --tag fcopy-web:test \
            --build-arg "VERSION=$version" --build-arg "REVISION=$GITHUB_SHA" .
          docker compose --file packaging/docker/compose.yml config --quiet
          bash packaging/docker/test.sh
          docker save fcopy-web:test | gzip -1 > tested-container.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tested-container
          path: tested-container.tar.gz
          if-no-files-found: error
          retention-days: 3

  lxc-test:
    name: Native hosted package on Debian ${{ matrix.debian }}
    needs: build
    runs-on: ubuntu-24.04
    container: debian:${{ matrix.debian }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13']
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - name: Verify the LXC service payload without modifying a hypervisor
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          tar -xzf dist/fcopy-web-*-linux-x86_64.tar.gz -C /tmp
          bash "/tmp/fcopy-web-$VERSION/install-lxc.sh" --no-start
          systemd-analyze verify /etc/systemd/system/fcopy-web.service
          /usr/local/bin/fcopy-web --help
          test "$(stat -c '%U' /var/lib/fcopy-web)" = fcopy-web
          bash packaging/hosted/smoke-test.sh

  image-publish:
    name: Publish tested GHCR image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, deb-test, rpm-test, arch, macos, windows, docker-test, lxc-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-container
          path: container
      - name: Push the exact image that passed restart and recovery tests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gunzip -c container/tested-container.tar.gz | docker load
          image="ghcr.io/${GITHUB_REPOSITORY,,}-web"
          version="${RELEASE_TAG#v}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag fcopy-web:test "$image:$version"
          docker tag fcopy-web:test "$image:latest"
          docker push "$image:$version"
          docker push "$image:latest"
          # GHCR can initially create private packages. The owner must make the
          # package public once before an anonymous deployment can pull it.
          anonymous=$(mktemp -d)
          DOCKER_CONFIG="$anonymous" docker manifest inspect "$image:$version" > /dev/null

  publish:
    name: Publish tagged release downloads
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, deb-test, rpm-test, arch, macos, windows, docker-test, lxc-test, image-publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*package*'
          merge-multiple: true
          path: dist
      - name: Generate checksums and publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd dist
          test "$(find . -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.rpm' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.pkg.tar.zst' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.dmg' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*linux-x86_64.tar.gz' | wc -l)" -eq 1
          test -f fcopy-unraid.xml
          test "$(find . -maxdepth 1 -name '*-windows-x86_64-unsigned-setup.exe' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*-windows-x86_64-unsigned-portable.zip' | wc -l)" -eq 1
          sha256sum ./*.deb ./*.rpm ./*.AppImage ./*.pkg.tar.zst ./*.dmg ./*.tar.gz ./*.xml ./*.exe ./*.zip > SHA256SUMS
          existing=$(gh release list --limit 100 --json tagName --jq \
            ".[] | select(.tagName == \"$RELEASE_TAG\") | .tagName")
          if [[ -z $existing ]]; then
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "FCOPY $RELEASE_TAG" --generate-notes ./*
          else
            gh release upload "$RELEASE_TAG" ./* --clobber
          fi
